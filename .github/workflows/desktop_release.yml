name: V2A Multi-Platform Release (Android, Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - desktop-v1.2.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # Windows Desktop Build & Packaging
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup and WiX Toolset
        run: choco install innosetup wixtoolset --yes

      - name: Verify Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Tests
        run: flutter test -j 1

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\v2a_setup.iss

      - name: Build WiX MSI Installer
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_msi.ps1

      - name: Build Portable ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_portable.ps1 -Mode lite

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-windows-1.2.3
          path: |
            dist/V2A-Setup-1.2.3-x64.exe
            dist/V2A-1.2.3-x64.msi
            dist/V2A-1.2.3-Windows-x64-Portable.zip

  # ==========================================
  # macOS Desktop Build & Packaging
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Desktop Release
        run: flutter build macos --release

      - name: Package DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh

      - name: Package PKG
        run: |
          chmod +x packaging/macos/build_pkg.sh
          ./packaging/macos/build_pkg.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-macos-1.2.3
          path: |
            dist/V2A-1.2.3-macOS.dmg
            dist/V2A-1.2.3-macOS.pkg

  # ==========================================
  # Linux Desktop Build & Packaging
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev alien rpm file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: |
          flutter build linux --release

      - name: Check Linux Binary
        run: |
          ls -la build/linux/x64/release/bundle/
          test -f build/linux/x64/release/bundle/v2a

      - name: Package Linux .deb & .tar.gz
        run: |
          chmod +x packaging/linux/*.sh
          ./packaging/linux/build_deb.sh
          ./packaging/linux/build_tar.sh

      - name: Package Linux .rpm
        run: |
          ./packaging/linux/build_rpm.sh || true

      - name: Package Linux .AppImage
        run: |
          ./packaging/linux/build_appimage.sh || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2a-linux-1.2.3
          path: |
            dist/V2A-1.2.3-Linux-x64.deb
            dist/V2A-1.2.3-Linux-x64.rpm
            dist/V2A-1.2.3-x86_64.AppImage
            dist/V2A-1.2.3-Linux-x64-Portable.tar.gz

  # ==========================================
  # Android APK & App Bundle Build
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Split APKs
        run: flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Build Android Universal APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Organize Android Artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/V2A-arm64-v8a-release.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/V2A-armeabi-v7a-release.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/V2A-x86_64-release.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/V2A-universal-release.apk || true
          cp build/app/outputs/bundle/release/app-release.aab dist/android/V2A-release.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-android-1.2.3
          path: dist/android/*

  # ==========================================
  # GitHub Release Publisher
  # ==========================================
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux, build-android]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/desktop-v1.2.3' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-windows-1.2.3
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-macos-1.2.3
          path: release_assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-linux-1.2.3
          path: release_assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-android-1.2.3
          path: release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release_assets/**/*
          name: "V2A v1.2.3 — Critical Desktop Runtime Repair, Dynamic Channel Detection & Multi-Platform Release"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
