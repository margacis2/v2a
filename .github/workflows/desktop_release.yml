name: V2A Multi-Platform Release (Android, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - desktop-v1.2.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # Windows Desktop Build & Packaging
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Verify Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Tests
        run: flutter test -j 1

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\v2a_setup.iss

      - name: Build Portable ZIP
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build_portable.ps1 -Mode lite

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-windows-1.2.0
          path: |
            dist/V2A-Setup-1.2.0-x64.exe
            dist/V2A-1.2.0-Windows-x64-Portable.zip

  # ==========================================
  # macOS Desktop Build & Packaging
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Desktop Release
        run: flutter build macos --release

      - name: Package DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh

      - name: Package PKG
        run: |
          chmod +x packaging/macos/build_pkg.sh
          ./packaging/macos/build_pkg.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-macos-1.2.0
          path: |
            dist/V2A-1.2.0-macOS.dmg
            dist/V2A-1.2.0-macOS.pkg

  # ==========================================
  # Android APK & App Bundle Build
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Split APKs
        run: flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Build Android Universal APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Organize Android Artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/V2A-arm64-v8a-release.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/V2A-armeabi-v7a-release.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/V2A-x86_64-release.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/V2A-universal-release.apk || true
          cp build/app/outputs/bundle/release/app-release.aab dist/android/V2A-release.aab || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2a-android-1.2.0
          path: dist/android/*

  # ==========================================
  # GitHub Release Publisher
  # ==========================================
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-android]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-windows-1.2.0
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-macos-1.2.0
          path: release_assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: v2a-android-1.2.0
          path: release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: "V2A v1.2.0 — Multi-Platform Release (Android, Windows, macOS)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
